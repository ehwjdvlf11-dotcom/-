name: Auto Post to X (Fixed Header/Footer & 10min Random)

on:
  schedule:
    - cron: '*/10 0-16,22-23 * * *'
  repository_dispatch:
    types: [run-x-bot]
  workflow_dispatch:

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests requests-oauthlib

      - name: Run script
        env:
          TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
          TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: |
          python - << 'EOF'
          import os
          import glob
          import random
          import string
          from requests_oauthlib import OAuth1Session

          api_key = os.environ['TWITTER_CONSUMER_KEY'].strip()
          api_secret = os.environ['TWITTER_CONSUMER_SECRET'].strip()
          access_token = os.environ['TWITTER_ACCESS_TOKEN'].strip()
          access_token_secret = os.environ['TWITTER_ACCESS_TOKEN_SECRET'].strip()

          twitter = OAuth1Session(
              api_key,
              client_secret=api_secret,
              resource_owner_key=access_token,
              resource_owner_secret=access_token_secret
          )

          # 1. 저장소 내 랜덤 이미지 파일 URL 생성 (raw link)
          repo_owner = "ehwjdvlf11-dotcom"
          repo_name = "-"
          
          image_files = glob.glob('*.jpg') + glob.glob('*.jpeg') + glob.glob('*.png') + glob.glob('*.PNG') + glob.glob('*.JPG')
          image_url = ""

          if image_files:
              selected_image = random.choice(image_files)
              print(f"선택된 이미지: {selected_image}")
              image_url = f"https://raw.githubusercontent.com/{repo_owner}/{repo_name}/main/{selected_image}"

          # 2. 본문 문구 조합
          header = "서치밴 서치벤 안걸려있는 X 엑스 15,000 양도\n프로필 문의"

          middle_phrases = [
              "트위터 #서치벤 계정 ㅅㅊㅂㅌㅅㅌ 양도",
              "스타레일 계정판매 ㅌㅅㅌ 거래 아이디 구매",
              "ㅅㅊㅂ 코리아 원신 서치밴테스트 서치벤테스트",
              "솜인형 판매 테스트 #서치밴"
          ]

          random.shuffle(middle_phrases)

          middle_text = "\n".join(middle_phrases)
          full_text = f"{header}\n{middle_text}"

          random_suffix = ''.join(random.choices(string.ascii_letters, k=3))
          
          if image_url:
              tweet_text = f"{full_text}\n{image_url} {random_suffix}"
          else:
              tweet_text = f"{full_text} {random_suffix}"

          # 3. v2 pure 텍스트 작성 (이미지 링크 포함)
          tweet_url = "https://api.twitter.com/2/tweets"
          payload = {"text": tweet_text}

          res_tweet = twitter.post(tweet_url, json=payload)

          print(f"상태 코드: {res_tweet.status_code}")
          print(f"응답 내용: {res_tweet.text}")

          if res_tweet.status_code in [200, 201]:
              print("트윗 전송 성공!")
          else:
              print("트윗 전송 실패")
              exit(1)
          EOF

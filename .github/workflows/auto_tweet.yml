name: Auto Post to X

on:
  schedule:
    - cron: '*/10 0-16,22-23 * * *'
  repository_dispatch:
    types: [run-x-bot]
  workflow_dispatch:

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests requests_oauthlib

      - name: Run script
        env:
          TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
          TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: |
          python - << 'EOF'
          import os
          import requests
          from requests_oauthlib import OAuth1

          url = "https://api.twitter.com/2/tweets"
          
          auth = OAuth1(
              os.environ['TWITTER_CONSUMER_KEY'].strip(),
              os.environ['TWITTER_CONSUMER_SECRET'].strip(),
              os.environ['TWITTER_ACCESS_TOKEN'].strip(),
              os.environ['TWITTER_ACCESS_TOKEN_SECRET'].strip()
          )

          response = requests.post(url, json={"text": "테스트 트윗입니다"}, auth=auth)
          
          print("\n================ [ X 서버 실제 응답 ] ================")
          print("상태 코드:", response.status_code)
          print("응답 내용:", response.text)
          print("====================================================\n")

          if response.status_code not in [200, 201]:
              exit(1)
          EOF

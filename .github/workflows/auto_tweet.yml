name: Auto Post to X (15min Interval & Random)

on:
  schedule:
    # 15분마다 자동 실행 (cron 표현식 수정)
    - cron: '*/15 * * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tweepy

      - name: Run script
        env:
          TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
          TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: |
          python - << 'EOF'
          import os
          import random
          import string
          import tweepy

          api_key = os.environ['TWITTER_CONSUMER_KEY']
          api_secret = os.environ['TWITTER_CONSUMER_SECRET']
          access_token = os.environ['TWITTER_ACCESS_TOKEN']
          access_token_secret = os.environ['TWITTER_ACCESS_TOKEN_SECRET']

          client = tweepy.Client(
              consumer_key=api_key,
              consumer_secret=api_secret,
              access_token=access_token,
              access_token_secret=access_token_secret
          )

          base_text = "서치밴 안걸려있는 X 엑스 1.5 양도\n프로필 문의\n트위터 #서치벤  계정 ㅅㅊㅂㅌㅅㅌ 양도 스타레일 계정판매 ㅌㅅㅌ 거래 아이디 구매 ㅅㅊㅂ 코리아 원신 서치밴테스트 서치벤테스트 솜인형 판매 테스트 #서치밴"
          
          # 중복 방지를 위해 무작위 알파벳 3글자 생성
          random_suffix = ''.join(random.choices(string.ascii_letters, k=3))
          tweet_text = f"{base_text} [{random_suffix}]"

          response = client.create_tweet(text=tweet_text)
          print(f"트윗 전송 성공! 내용: {tweet_text} / ID: {response.data['id']}")
          EOF

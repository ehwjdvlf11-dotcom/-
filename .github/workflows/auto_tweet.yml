name: Auto Post to X with Random Image (Tweepy)

on:
  schedule:
    # 한국 시간(KST) 기준 오전 08:00 ~ 새벽 01:00 (13분 간격)
    # (UTC 기준 23:00~23:59, 00:00~16:00)
    - cron: '*/13 0-16,23 * * *'
  repository_dispatch:
    types: [run-x-bot]
  workflow_dispatch:

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tweepy

      - name: Run script
        env:
          TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
          TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: |
          python - << 'EOF'
          import os
          import random
          import string
          import tweepy

          api_key = os.environ['TWITTER_CONSUMER_KEY'].strip()
          api_secret = os.environ['TWITTER_CONSUMER_SECRET'].strip()
          access_token = os.environ['TWITTER_ACCESS_TOKEN'].strip()
          access_token_secret = os.environ['TWITTER_ACCESS_TOKEN_SECRET'].strip()

          # 1. 저장소에 올라간 전체 이미지 파일 목록 지정
          image_list = [
              "photo_2026-06-25_16-51-41.jpg",
              "photo_2026-07-29_10-02-25.jpg",
              "photo_2026-07-29_10-02-27.jpg",
              "photo_2026-07-29_10-02-28.jpg",
              "photo_2026-07-29_10-02-29.jpg",
              "photo_2026-07-29_10-02-31.jpg",
              "photo_2026-07-29_10-02-32.jpg",
              "photo_2026-07-29_10-02-33.jpg",
              "photo_2026-08-11_22-17-08.jpg",
              "photo_2026-08-11_22-17-09.jpg",
              "photo_2026-08-11_22-17-10.jpg",
              "photo_2026-08-11_22-17-11.jpg",
              "photo_2026-08-11_22-17-48.jpg",
              "photo_2026-08-11_22-17-49.jpg",
              "photo_2026-08-11_22-17-50.jpg",
              "photo_2026-08-11_22-17-51.jpg",
              "photo_2026-08-11_22-17-52.jpg",
              "photo_2026-08-11_22-17-53.jpg",
              "photo_2026-08-12_20-06-03.jpg",
              "photo_2026-08-12_20-06-04.jpg",
              "photo_2026-08-12_20-06-05.jpg",
              "photo_2026-08-12_20-06-06.jpg",
              "photo_2026-08-12_20-06-07.jpg",
              "photo_2026-08-12_20-06-08.jpg",
              "photo_2026-08-12_20-06-09.jpg",
              "photo_2026-08-12_20-06-10.jpg"
          ]

          # 저장소에 실제 존재하는 파일만 필터링
          valid_images = [img for img in image_list if os.path.exists(img)]

          if not valid_images:
              print("오류: 지정한 이미지 파일이 저장소 루트 경로에 하나도 없습니다!")
              exit(1)

          # 무작위로 이미지 1개 선택
          selected_image = random.choice(valid_images)
          print(f"선택된 이미지: {selected_image}")

          # 2. Tweepy 클라이언트 설정
          auth = tweepy.OAuth1UserHandler(
              api_key, api_secret, access_token, access_token_secret
          )
          api_v1 = tweepy.API(auth)

          client_v2 = tweepy.Client(
              consumer_key=api_key,
              consumer_secret=api_secret,
              access_token=access_token,
              access_token_secret=access_token_secret
          )

          # 3. 이미지 업로드 (v1.1 API)
          try:
              print("이미지 업로드 중...")
              media = api_v1.media_upload(filename=selected_image)
              media_id = media.media_id_string
              print(f"이미지 업로드 성공! Media ID: {media_id}")
          except Exception as e:
              print(f"이미지 업로드 실패: {e}")
              exit(1)

          # 4. 문구 생성 (가격 1.5 반영)
          header = "서치밴 서치벤 안걸려있는 X 엑스 1.5 양도\n프로필 문의"
          middle_phrases = [
              "트위터 #서치벤 계정 ㅅㅊㅂㅌㅅㅌ 양도",
              "스타레일 계정판매 ㅌㅅㅌ 거래 아이디 구매",
              "ㅅㅊㅂ 코리아 원신 서치밴테스트 서치벤테스트",
              "솜인형 판매 테스트 #서치밴"
          ]
          random.shuffle(middle_phrases)

          full_text = f"{header}\n" + "\n".join(middle_phrases)
          random_suffix = ''.join(random.choices(string.ascii_letters, k=3))
          tweet_text = f"{full_text} {random_suffix}"

          # 5. 트윗 작성 (v2 API)
          try:
              response = client_v2.create_tweet(
                  text=tweet_text,
                  media_ids=[media_id]
              )
              print(f"사진 포함 트윗 전송 성공! Tweet ID: {response.data['id']}")
          except Exception as e:
              print(f"트윗 작성 실패: {e}")
              exit(1)
          EOF

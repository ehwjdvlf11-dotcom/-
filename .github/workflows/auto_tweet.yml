name: Auto Post to X with Image (OAuth 1.0a)

on:
  schedule:
    - cron: '*/10 0-16,22-23 * * *'
  repository_dispatch:
    types: [run-x-bot]
  workflow_dispatch:

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests requests-oauthlib

      - name: Run script
        env:
          TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
          TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: |
          python - << 'EOF'
          import os
          import random
          import string
          from requests_oauthlib import OAuth1Session

          api_key = os.environ['TWITTER_CONSUMER_KEY'].strip()
          api_secret = os.environ['TWITTER_CONSUMER_SECRET'].strip()
          access_token = os.environ['TWITTER_ACCESS_TOKEN'].strip()
          access_token_secret = os.environ['TWITTER_ACCESS_TOKEN_SECRET'].strip()

          # OAuth 1.0a 세션 생성
          twitter = OAuth1Session(
              api_key,
              client_secret=api_secret,
              resource_owner_key=access_token,
              resource_owner_secret=access_token_secret
          )

          # 1. 이미지 파일 업로드 (v1.1 API)
          image_path = "image.jpg"  # 저장소 내 이미지 파일 경로
          media_id = None

          if os.path.exists(image_path):
              upload_url = "https://upload.twitter.com/1.1/media/upload.json"
              with open(image_path, "rb") as image_file:
                  files = {"media": image_file}
                  upload_res = twitter.post(upload_url, files=files)
              
              if upload_res.status_code == 200:
                  media_id = upload_res.json().get("media_id_string")
                  print(f"이미지 업로드 성공! Media ID: {media_id}")
              else:
                  print(f"이미지 업로드 실패 ({upload_res.status_code}): {upload_res.text}")
          else:
              print(f"경고: {image_path} 파일을 찾을 수 없습니다. 텍스트만 전송합니다.")

          # 2. 문구 생성 (가격 1.5로 수정)
          header = "서치밴 서치벤 안걸려있는 X 엑스 1.5 양도\n프로필 문의"
          middle_phrases = [
              "트위터 #서치벤 계정 ㅅㅊㅂㅌㅅㅌ 양도",
              "스타레일 계정판매 ㅌㅅㅌ 거래 아이디 구매",
              "ㅅㅊㅂ 코리아 원신 서치밴테스트 서치벤테스트",
              "솜인형 판매 테스트 #서치밴"
          ]
          random.shuffle(middle_phrases)

          full_text = f"{header}\n" + "\n".join(middle_phrases)
          random_suffix = ''.join(random.choices(string.ascii_letters, k=3))
          tweet_text = f"{full_text} {random_suffix}"

          # 3. 페이로드 생성
          payload = {"text": tweet_text}
          if media_id:
              payload["media"] = {"media_ids": [media_id]}

          # 4. 트윗 작성 (v2 API)
          tweet_url = "https://api.twitter.com/2/tweets"
          res = twitter.post(tweet_url, json=payload)

          print(f"상태 코드: {res.status_code}")
          print(f"응답 내용: {res.text}")

          if res.status_code in [200, 201]:
              print("트윗 전송 성공!")
          else:
              print("트윗 전송 실패")
              exit(1)
          EOF

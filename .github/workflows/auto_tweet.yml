name: Auto Post to X (Bearer Token Direct Post)

on:
  schedule:
    - cron: '*/10 0-16,22-23 * * *'
  repository_dispatch:
    types: [run-x-bot]
  workflow_dispatch:

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests requests-oauthlib

      - name: Run script
        env:
          TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
          TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          import random
          import string
          import requests
          from requests_oauthlib import OAuth1

          api_key = os.environ['TWITTER_CONSUMER_KEY'].strip()
          api_secret = os.environ['TWITTER_CONSUMER_SECRET'].strip()
          access_token = os.environ['TWITTER_ACCESS_TOKEN'].strip()
          access_token_secret = os.environ['TWITTER_ACCESS_TOKEN_SECRET'].strip()
          bearer_token = os.environ.get('TWITTER_BEARER_TOKEN', '').strip()

          header = "서치밴 서치벤 안걸려있는 X 엑스 15,000 양도\n프로필 문의"

          middle_phrases = [
              "트위터 #서치벤 계정 ㅅㅊㅂㅌㅅㅌ 양도",
              "스타레일 계정판매 ㅌㅅㅌ 거래 아이디 구매",
              "ㅅㅊㅂ 코리아 원신 서치밴테스트 서치벤테스트",
              "솜인형 판매 테스트 #서치밴"
          ]

          random.shuffle(middle_phrases)

          middle_text = "\n".join(middle_phrases)
          full_text = f"{header}\n{middle_text}"

          random_suffix = ''.join(random.choices(string.ascii_letters, k=3))
          tweet_text = f"{full_text} {random_suffix}"

          tweet_url = "https://api.twitter.com/2/tweets"
          payload = {"text": tweet_text}

          # 1차 시도: OAuth 1.0a User Context
          auth = OAuth1(api_key, api_secret, access_token, access_token_secret)
          headers = {"Content-Type": "application/json"}

          res = requests.post(tweet_url, auth=auth, json=payload, headers=headers)

          # 2차 시도: Bearer Token (1차 실패 시 자동 전환)
          if res.status_code == 403 and bearer_token:
              print("OAuth1 403 발생 -> Bearer Token 인증으로 재시도합니다.")
              bearer_headers = {
                  "Authorization": f"Bearer {bearer_token}",
                  "Content-Type": "application/json"
              }
              res = requests.post(tweet_url, json=payload, headers=bearer_headers)

          print(f"상태 코드: {res.status_code}")
          print(f"응답 내용: {res.text}")

          if res.status_code in [200, 201]:
              print("트윗 전송 성공!")
          else:
              print("트윗 전송 실패")
              exit(1)
          EOF

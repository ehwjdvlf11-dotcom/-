name: Auto Post to X (OAuth 2.0 Fixed)

on:
  schedule:
    - cron: '*/10 0-16,22-23 * * *'
  repository_dispatch:
    types: [run-x-bot]
  workflow_dispatch:

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tweepy

      - name: Run script
        env:
          TWITTER_CLIENT_ID: ${{ secrets.TWITTER_CLIENT_ID }}
          TWITTER_CLIENT_SECRET: ${{ secrets.TWITTER_CLIENT_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: |
          python - << 'EOF'
          import os
          import random
          import string
          import tweepy

          client_id = os.environ['TWITTER_CLIENT_ID'].strip()
          client_secret = os.environ['TWITTER_CLIENT_SECRET'].strip()
          access_token = os.environ['TWITTER_ACCESS_TOKEN'].strip()
          access_token_secret = os.environ['TWITTER_ACCESS_TOKEN_SECRET'].strip()

          client = tweepy.Client(
              consumer_key=client_id,
              consumer_secret=client_secret,
              access_token=access_token,
              access_token_secret=access_token_secret
          )

          header = "서치밴 안걸려있는 X 엑스 1.5 양도\n프로필 문의"

          middle_phrases = [
              "트위터 #서치벤 계정 ㅅㅊㅂㅌㅅㅌ 양도",
              "스타레일 계정판매 ㅌㅅㅌ 거래 아이디 구매",
              "ㅅㅊㅂ 코리아 원신 서치밴테스트 서치벤테스트",
              "솜인형 판매 테스트 #서치밴"
          ]

          random.shuffle(middle_phrases)

          middle_text = "\n".join(middle_phrases)
          full_text = f"{header}\n{middle_text}"

          random_suffix = ''.join(random.choices(string.ascii_letters, k=3))
          tweet_text = f"{full_text} {random_suffix}"

          response = client.create_tweet(text=tweet_text)
          print(f"트윗 전송 성공! 내용:\n{tweet_text}\nID: {response.data['id']}")
          EOF

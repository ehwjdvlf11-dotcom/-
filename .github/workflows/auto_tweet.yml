name: Auto Post to X (Debug Mode)

on:
  workflow_dispatch:

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests requests-oauthlib

      - name: Run debug script
        env:
          TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
          TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: |
          python - << 'EOF'
          import os
          import json
          import glob
          import random
          from requests_oauthlib import OAuth1Session

          api_key = os.environ['TWITTER_CONSUMER_KEY'].strip()
          api_secret = os.environ['TWITTER_CONSUMER_SECRET'].strip()
          access_token = os.environ['TWITTER_ACCESS_TOKEN'].strip()
          access_token_secret = os.environ['TWITTER_ACCESS_TOKEN_SECRET'].strip()

          twitter = OAuth1Session(
              api_key,
              client_secret=api_secret,
              resource_owner_key=access_token,
              resource_owner_secret=access_token_secret
          )

          print("=== 1. 이미지 업로드 테스트 ===")
          image_files = glob.glob('*.jpg') + glob.glob('*.jpeg') + glob.glob('*.png') + glob.glob('*.PNG') + glob.glob('*.JPG')
          media_id = None

          if image_files:
              selected_image = random.choice(image_files)
              print(f"선택된 이미지: {selected_image}")
              upload_url = "https://upload.twitter.com/1.1/media/upload.json"
              with open(selected_image, 'rb') as f:
                  files = {'media': f}
                  res_media = twitter.post(upload_url, files=files)
              
              print(f"이미지 응답 코드: {res_media.status_code}")
              print(f"이미지 응답 본문: {res_media.text}")
              
              if res_media.status_code in [200, 201]:
                  media_id = res_media.json().get('media_id_string')
          else:
              print("이미지 파일이 존재하지 않습니다.")

          print("\n=== 2. v2 트윗 작성 테스트 ===")
          tweet_url = "https://api.twitter.com/2/tweets"
          payload = {"text": "테스트 트윗입니다."}
          if media_id:
              payload["media"] = {"media_ids": [media_id]}

          res_tweet = twitter.post(tweet_url, json=payload)

          print(f"트윗 응답 코드: {res_tweet.status_code}")
          print(f"트윗 응답 상세 내용:")
          try:
              print(json.dumps(res_tweet.json(), indent=2, ensure_ascii=False))
          except Exception:
              print(res_tweet.text)

          if res_tweet.status_code not in [200, 201]:
              exit(1)
          EOF
